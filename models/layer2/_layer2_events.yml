version: 2

models:
  - name: int_terminal_deleted_customer_keys
    description: >
      Incremental suppression-admission ledger and delete/reassignment gate at one row per historical
      customer key.
      A row is first recorded only after an independently confirmed plan contains every required
      target, and ordinary runs never remove it. The row authorizes and preserves suppression; it
      is not evidence that every downstream relation completed successfully.
    config:
      contract:
        enforced: true
      grants:
        select: [privacy_admins]
    columns:
      - name: decision_revision_id
        data_type: string
        description: Effective decision revision; advances on escalation or a newer same-mode revision.
        data_tests: [not_null]
      - name: deletion_request_id
        data_type: string
        description: Request of the effective revision; it advances on escalation or a newer same-mode revision.
        data_tests: [not_null]
      - name: customer_key
        data_type: string
        description: Authorized historical customer key used to anti-join deleted subjects.
        data_tests: [not_null, unique]
      - name: authorized_at
        data_type: timestamp
        description: Timestamp of the independent decision that authorized suppression.
        data_tests: [not_null]
      - name: authorization_recorded_at
        data_type: timestamp
        description: Immutable recorded timestamp of the effective authorization revision.
        data_tests: [not_null]
      - name: deletion_mode
        data_type: string
        description: Effective terminal mode; FULL has priority and can never downgrade to SPECIAL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["SPECIAL_DELETION", "FULL_GOVERNED_OUTPUT_DELETION"]
      - name: deletion_policy_version
        data_type: string
        description: Policy version attached to the effective mode.
        data_tests: [not_null]
      - {name: initial_decision_revision_id, data_type: string, description: First admitted decision revision, data_tests: [not_null]}
      - {name: initial_deletion_request_id, data_type: string, description: First complete request for this key, data_tests: [not_null]}
      - name: initial_deletion_mode
        data_type: string
        description: First admitted mode, preserved after escalation.
        data_tests: [not_null]
      - {name: initial_deletion_policy_version, data_type: string, description: Policy version of first admission, data_tests: [not_null]}
      - {name: initial_authorized_at, data_type: timestamp, description: First authorization timestamp, data_tests: [not_null]}
      - {name: initial_authorization_recorded_at, data_type: timestamp, description: Recorded timestamp of first admission, data_tests: [not_null]}
      - name: suppression_recorded_at
        data_type: timestamp
        description: Timestamp when this durable suppression-admission row was first written.
        data_tests: [not_null]
      - name: mode_escalated_at
        data_type: timestamp
        description: Ledger update timestamp when SPECIAL escalated to FULL; null without escalation.

  - name: int_customer_events_keyed
    description: >
      Ephemeral event boundary at one row per source event. The raw SSN is replaced immediately by
      its versioned customer key before any Layer2 resolution or join.
    columns:
      - name: event_id
        description: Stable source event identifier.
      - name: customer_key
        description: Versioned customer key derived in the customer.ssn domain.

  - name: int_customer_event_resolution
    description: >
      Ephemeral classifier at one row per source event. Events for suppression-admitted subjects
      remain accepted for identity-unlinked fact retention and are marked for erased-member reassignment;
      other events require a current customer mapping.
    columns:
      - name: event_id
        description: Stable source event identifier.
      - name: resolution_status
        description: Deterministic event acceptance or quarantine status.

  - name: int_customer_events_resolved
    description: >
      Protected Layer2 customer events at one row per accepted event. It contains only a
      pseudonymous or erased-member customer key and event measures; raw Personal Data is absent.
    config:
      contract:
        enforced: true
      tags: [layer2_events]
      databricks_tags:
        contains_personal_data: "true"
        personal_data_state: "PSEUDONYMIZED"
    columns:
      - name: event_id
        data_type: string
        description: Stable source event identifier.
        data_tests: [not_null, unique]
      - name: customer_key
        data_type: string
        description: Versioned pseudonymous customer key.
        databricks_tags:
          personal_data_category: "NATIONAL_IDENTIFIER"
          personal_data_state: "PSEUDONYMIZED"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fa_pd_customer')
                field: customer_key
              config:
                where: "not is_erased_customer"
      - name: event_type
        data_type: string
        description: Normalized event category.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["USAGE", "SUPPORT"]
      - name: occurred_at
        data_type: timestamp
        description: Event occurrence timestamp.
        data_tests: [not_null]
      - name: measure_value
        data_type: decimal(18,2)
        description: Numeric event measure.
        data_tests: [not_null]
      - name: measure_unit
        data_type: string
        description: Unit for measure_value.
        data_tests: [not_null]
      - name: source_updated_at
        data_type: timestamp
        description: Last source update timestamp.
        data_tests: [not_null]
      - name: is_erased_customer
        data_type: boolean
        description: True when the current output replaces the original customer key with the erased member.
        data_tests: [not_null]

unit_tests:
  - name: latest_same_mode_policy_revision_wins
    description: A newer revision within the winning mode advances policy evidence without changing first admission.
    model: int_terminal_deleted_customer_keys
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_customer_deletion_plan')
        format: sql
        rows: |
          with revisions as (
              select * from values
                  ('REV-SPECIAL-V1', 'POLICY_V1', cast('2026-02-16 08:00:00' as timestamp)),
                  ('REV-SPECIAL-V2', 'POLICY_V2', cast('2026-02-20 08:00:00' as timestamp))
                  as revisions(decision_revision_id, deletion_policy_version, recorded_at)
          ),
          targets as (
              select * from values
                  ('layer1', 'quarantine_customer_events', 'TABLE', 'DELETE_CURRENT_ROWS'),
                  ('layer1', 'quarantine_customer_services', 'TABLE', 'DELETE_CURRENT_ROWS'),
                  ('layer1', 'quarantine_invoices', 'TABLE', 'DELETE_CURRENT_ROWS'),
                  ('priva_map', 'fa_pd_customer', 'TABLE', 'DELETE_CURRENT_ROWS'),
                  ('priva_map', 'fa_pd_service_address', 'TABLE', 'DELETE_CURRENT_ROWS'),
                  ('layer2', 'int_customer_protected', 'TABLE', 'DELETE_CURRENT_ROWS'),
                  ('layer2', 'int_customer_events_resolved', 'TABLE', 'REASSIGN_TO_ERASED_MEMBER'),
                  ('layer2', 'int_customer_services_resolved', 'TABLE', 'DELETE_CURRENT_ROWS'),
                  ('layer2', 'int_invoices_resolved', 'TABLE', 'REASSIGN_TO_ERASED_MEMBER'),
                  ('layer3', 'dim_customer', 'TABLE', 'DELETE_CURRENT_ROWS'),
                  ('layer3', 'dim_service', 'TABLE', 'DELETE_CURRENT_ROWS'),
                  ('layer3', 'fct_customer_event', 'TABLE', 'REASSIGN_TO_ERASED_MEMBER'),
                  ('layer3', 'fct_invoice', 'TABLE', 'REASSIGN_TO_ERASED_MEMBER'),
                  ('layer3_case', 'case_dim_customer', 'VIEW', 'EXCLUDE_ERASED_ROWS'),
                  ('layer3_case', 'case_dim_service', 'VIEW', 'EXCLUDE_ERASED_ROWS'),
                  ('layer3_case', 'case_fct_customer_event', 'VIEW', 'EXCLUDE_ERASED_ROWS'),
                  ('layer3_case', 'case_fct_invoice', 'VIEW', 'EXCLUDE_ERASED_ROWS')
                  as targets(
                      target_layer, target_relation, target_kind, special_deletion_action
                  )
          )
          select
              revisions.decision_revision_id,
              'REQUEST-1' as deletion_request_id,
              'customer-key' as customer_key,
              'SPECIAL_DELETION' as deletion_mode,
              revisions.deletion_policy_version,
              revisions.recorded_at as authorization_recorded_at,
              targets.target_layer,
              targets.target_relation,
              targets.target_kind,
              targets.special_deletion_action as planned_action,
              'AUTHORIZED' as plan_status,
              revisions.recorded_at as authorized_at
          from revisions cross join targets
    expect:
      rows:
        - decision_revision_id: REV-SPECIAL-V2
          deletion_policy_version: POLICY_V2
          initial_decision_revision_id: REV-SPECIAL-V1
          initial_deletion_policy_version: POLICY_V1
          deletion_mode: SPECIAL_DELETION
          initial_deletion_mode: SPECIAL_DELETION

  - name: erased_event_uses_special_customer_member
    description: SPECIAL retains an event under the erased member while FULL removes the event.
    model: int_customer_event_resolution
    given:
      - input: ref('int_customer_events_keyed')
        format: sql
        rows: |
          select
            'EVT-SPECIAL' as event_id,
            'special-customer-key' as customer_key,
            'USAGE' as event_type,
            cast('2026-02-20 08:00:00' as timestamp) as occurred_at,
            cast(9.50 as decimal(18, 2)) as measure_value,
            'GB' as measure_unit,
            cast('2026-02-20 09:00:00' as timestamp) as source_updated_at
          union all
          select
            'EVT-FULL', 'full-customer-key', 'USAGE',
            cast('2026-02-20 08:00:00' as timestamp),
            cast(7.25 as decimal(18, 2)), 'GB',
            cast('2026-02-20 09:00:00' as timestamp)
          union all
          select
            'EVT-ORDINARY', 'ordinary-customer-key', 'SUPPORT',
            cast('2026-02-20 10:00:00' as timestamp),
            cast(5.00 as decimal(18, 2)), 'MINUTES',
            cast('2026-02-20 11:00:00' as timestamp)
      - input: ref('int_terminal_deleted_customer_keys')
        format: sql
        rows: |
          select 'special-customer-key' as customer_key, 'SPECIAL_DELETION' as deletion_mode
          union all
          select 'full-customer-key', 'FULL_GOVERNED_OUTPUT_DELETION'
      - input: ref('fa_pd_customer')
        format: sql
        rows: |
          select 'ordinary-customer-key' as customer_key
    expect:
      rows:
        - event_id: EVT-SPECIAL
          customer_key: "{{ var('erased_member_key') }}"
          is_erased_customer: true
          resolution_status: ACCEPTED
        - event_id: EVT-ORDINARY
          customer_key: ordinary-customer-key
          is_erased_customer: false
          resolution_status: ACCEPTED
