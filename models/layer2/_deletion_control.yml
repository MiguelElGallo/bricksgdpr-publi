version: 2

models:
  - name: int_customer_deletion_plan
    description: >
      Authorized deletion worklist at one row per historical customer key and governed target
      relation. It is created only for confirmed requests without a legal hold and enumerates all
      current-state delete, erased-member reassignment, and case-view exclusion actions.
      Incremental merge retains authorized plan rows so a later missing decision cannot silently
      resurrect retained identity links. Full refresh is disabled; post-hooks archive evidence
      outside the model graph and pre-hooks guard retained keys.
    config:
      contract:
        enforced: true
      grants:
        select: [privacy_admins]
    columns:
      - name: decision_revision_id
        data_type: string
        description: Exact privacy decision revision that created this plan row.
        data_tests: [not_null]
      - name: deletion_request_id
        data_type: string
        description: Confirmed request that authorized this plan row.
        data_tests: [not_null]
      - name: customer_key
        data_type: string
        description: Versioned customer key for one current or historical source identity.
        data_tests: [not_null]
      - name: deletion_mode
        data_type: string
        description: Mode selected by the authorizing decision revision.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["SPECIAL_DELETION", "FULL_GOVERNED_OUTPUT_DELETION"]
      - name: deletion_policy_version
        data_type: string
        description: Versioned target/action contract used to build this plan.
        data_tests: [not_null]
      - name: authorization_recorded_at
        data_type: timestamp
        description: Immutable ingestion timestamp used to order decision revisions.
        data_tests: [not_null]
      - name: target_layer
        data_type: string
        description: dbt layer or controlled mapping area containing the target relation.
        data_tests: [not_null]
      - name: target_relation
        data_type: string
        description: Exact dbt relation whose current rows must exclude the customer key.
        data_tests: [not_null]
      - name: target_kind
        data_type: string
        description: Whether the target is a persisted TABLE or derived VIEW.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["TABLE", "VIEW"]
      - name: planned_action
        data_type: string
        description: Target-specific deletion, erased-member reassignment, or case-view exclusion action.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["DELETE_CURRENT_ROWS", "REASSIGN_TO_ERASED_MEMBER", "EXCLUDE_ERASED_ROWS", "EXCLUDE_DELETED_ROWS"]
      - name: plan_status
        data_type: string
        description: Constant AUTHORIZED state; unconfirmed requests produce no plan rows.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["AUTHORIZED"]
      - name: authorized_at
        data_type: timestamp
        description: Timestamp of the independent confirmation that authorized the plan.
        data_tests: [not_null]
