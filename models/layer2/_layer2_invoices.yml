version: 2

models:
  - name: int_invoices_keyed
    description: >
      Ephemeral invoice boundary at one row per source invoice. The raw SSN and service reference
      are replaced immediately by domain-separated keys.
    columns:
      - name: invoice_id
        description: Stable source invoice identifier.
      - name: customer_key
        description: Versioned customer key derived in the customer.ssn domain.

  - name: int_invoice_resolution
    description: >
      Ephemeral invoice classifier at one row per source invoice. Every invoice evaluates source
      service, validity-period, invoice-date, and payment controls. Valid suppression-admitted rows
      are retained under erased members; invalid ones enter the authorized-suppression outcome
      instead of a raw Personal Data quarantine.
    columns:
      - name: resolution_status
        description: Deterministic invoice acceptance, quarantine, or authorized-suppression reason.

  - name: int_invoices_resolved
    description: >
      Protected Layer2 invoices at one row per accepted invoice. It contains pseudonymous customer
      and service keys or erased-member sentinels, monetary measures, dates, and an as-of-date
      due-state calculation.
    config:
      contract:
        enforced: true
      tags: [layer2_invoices]
      databricks_tags:
        contains_personal_data: "true"
        personal_data_state: "PSEUDONYMIZED"
    columns:
      - name: invoice_id
        data_type: string
        description: Stable source invoice identifier.
        data_tests: [not_null, unique]
      - name: customer_key
        data_type: string
        description: Versioned pseudonymous customer key.
        databricks_tags:
          personal_data_category: "NATIONAL_IDENTIFIER"
          personal_data_state: "PSEUDONYMIZED"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fa_pd_customer')
                field: customer_key
              config:
                where: "not is_erased_customer"
      - name: service_key
        data_type: string
        description: Versioned pseudonymous service identifier.
        databricks_tags:
          personal_data_category: "SERVICE_IDENTIFIER"
          personal_data_state: "PSEUDONYMIZED"
        data_tests: [not_null]
      - name: service_version_key
        data_type: string
        description: Versioned accepted service-period key effective on issued_date.
        databricks_tags:
          personal_data_category: "SERVICE_IDENTIFIER"
          personal_data_state: "PSEUDONYMIZED"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_customer_services_resolved')
                field: service_version_key
              config:
                where: "not is_erased_customer"
      - name: amount
        data_type: decimal(18,2)
        description: Gross invoice amount.
        data_tests: [not_null]
      - name: currency_code
        data_type: string
        description: Billing currency code.
        data_tests: [not_null]
      - name: issued_date
        data_type: date
        description: Invoice issue date.
        data_tests: [not_null]
      - name: due_date
        data_type: date
        description: Contractual payment deadline.
        data_tests: [not_null]
      - name: is_paid
        data_type: boolean
        description: Validated source payment-state flag.
        data_tests: [not_null]
      - name: paid_at
        data_type: date
        description: Validated payment date when the invoice is paid.
      - name: source_is_due
        data_type: boolean
        description: Source due-state flag retained for audit comparison.
        data_tests: [not_null]
      - name: is_due
        data_type: boolean
        description: Deterministic due state calculated from is_paid, due_date, and as_of_date.
        data_tests: [not_null]
      - name: source_updated_at
        data_type: timestamp
        description: Last source update timestamp.
        data_tests: [not_null]
      - name: is_erased_customer
        data_type: boolean
        description: True when customer and service links were replaced by erased-member sentinels.
        data_tests: [not_null]

unit_tests:
  - name: erased_invoice_uses_special_customer_and_service_members
    description: SPECIAL retains an invoice under erased members while FULL removes the invoice.
    model: int_invoice_resolution
    given:
      - input: ref('int_invoices_keyed')
        format: sql
        rows: |
          select
            'INV-SPECIAL' as invoice_id,
            'special-customer-key' as customer_key,
            'special-service-key' as service_key,
            cast(99.00 as decimal(18, 2)) as amount,
            'EUR' as currency_code,
            cast('2026-02-01' as date) as issued_date,
            cast('2026-03-03' as date) as due_date,
            false as is_paid,
            cast(null as date) as paid_at,
            false as source_is_due,
            cast('2026-02-28 18:00:00' as timestamp) as source_updated_at
          union all
          select
            'INV-FULL', 'full-customer-key', 'full-service-key',
            cast(49.00 as decimal(18, 2)), 'EUR', cast('2026-02-01' as date),
            cast('2026-03-03' as date), false, cast(null as date), false,
            cast('2026-02-28 18:00:00' as timestamp)
          union all
          select
            'INV-ORDINARY', 'ordinary-customer-key', 'ordinary-service-key',
            cast(29.00 as decimal(18, 2)), 'EUR', cast('2026-02-01' as date),
            cast('2026-03-03' as date), false, cast(null as date), false,
            cast('2026-02-28 18:00:00' as timestamp)
      - input: ref('int_terminal_deleted_customer_keys')
        format: sql
        rows: |
          select 'special-customer-key' as customer_key, 'SPECIAL_DELETION' as deletion_mode
          union all
          select 'full-customer-key', 'FULL_GOVERNED_OUTPUT_DELETION'
      - input: ref('int_customer_services_keyed')
        format: sql
        rows: |
          select
            'special-customer-key' as customer_key,
            'special-service-key' as service_key,
            'special-service-version-key' as service_version_key,
            true as is_valid,
            cast('2026-01-01' as date) as valid_from,
            cast('2026-12-31' as date) as valid_to
          union all
          select
            'full-customer-key', 'full-service-key', 'full-service-version-key',
            true, cast('2026-01-01' as date), cast('2026-12-31' as date)
          union all
          select
            'ordinary-customer-key', 'ordinary-service-key', 'ordinary-service-version-key',
            true, cast('2026-01-01' as date), cast('2026-12-31' as date)
      - input: ref('int_customer_services_resolved')
        format: sql
        rows: |
          select
            'ordinary-customer-key' as customer_key,
            'ordinary-service-key' as service_key,
            'ordinary-service-version-key' as service_version_key,
            cast('2026-01-01' as date) as valid_from,
            cast('2026-12-31' as date) as valid_to
      - input: ref('fa_pd_customer')
        format: sql
        rows: |
          select 'ordinary-customer-key' as customer_key
    expect:
      rows:
        - invoice_id: INV-SPECIAL
          customer_key: "{{ var('erased_member_key') }}"
          service_key: "{{ var('erased_member_key') }}"
          resolved_service_version_key: "{{ var('erased_member_key') }}"
          is_erased_customer: true
          resolution_status: ACCEPTED
        - invoice_id: INV-ORDINARY
          customer_key: ordinary-customer-key
          service_key: ordinary-service-key
          resolved_service_version_key: ordinary-service-version-key
          is_erased_customer: false
          resolution_status: ACCEPTED

  - name: erased_invoice_still_checks_quality_rules
    description: Erasure must not promote invalid source invoices into retained facts.
    model: int_invoice_resolution
    given:
      - input: ref('int_invoices_keyed')
        format: sql
        rows: |
          select
            'INV-INVALID-DATES' as invoice_id,
            'deleted-customer-key' as customer_key,
            'valid-service-key' as service_key,
            cast(10.00 as decimal(18, 2)) as amount,
            'EUR' as currency_code,
            cast('2026-03-03' as date) as issued_date,
            cast('2026-02-01' as date) as due_date,
            false as is_paid,
            cast(null as date) as paid_at,
            false as source_is_due,
            cast('2026-03-03 09:00:00' as timestamp) as source_updated_at
          union all
          select
            'INV-INVALID-SERVICE', 'deleted-customer-key', 'invalid-service-key',
            cast(10.00 as decimal(18, 2)), 'EUR', cast('2026-02-01' as date),
            cast('2026-03-03' as date), false, cast(null as date), false,
            cast('2026-02-01 09:00:00' as timestamp)
      - input: ref('int_terminal_deleted_customer_keys')
        format: sql
        rows: |
          select 'deleted-customer-key' as customer_key, 'SPECIAL_DELETION' as deletion_mode
      - input: ref('int_customer_services_keyed')
        format: sql
        rows: |
          select
            'deleted-customer-key' as customer_key,
            'valid-service-key' as service_key,
            'valid-service-version-key' as service_version_key,
            true as is_valid,
            cast('2026-01-01' as date) as valid_from,
            cast('2026-12-31' as date) as valid_to
          union all
          select
            'deleted-customer-key', 'invalid-service-key', 'invalid-service-version-key',
            false, cast('2026-01-01' as date), cast('2026-12-31' as date)
      - input: ref('int_customer_services_resolved')
        format: sql
        rows: |
          select
            cast(null as string) as customer_key,
            cast(null as string) as service_key,
            cast(null as string) as service_version_key,
            cast(null as date) as valid_from,
            cast(null as date) as valid_to
          where false
      - input: ref('fa_pd_customer')
        format: sql
        rows: |
          select cast(null as string) as customer_key where false
    expect:
      rows:
        - {invoice_id: INV-INVALID-DATES, customer_key: "{{ var('erased_member_key') }}", is_erased_customer: true, resolution_status: INVALID_INVOICE_DATE_RANGE}
        - {invoice_id: INV-INVALID-SERVICE, customer_key: "{{ var('erased_member_key') }}", is_erased_customer: true, resolution_status: SERVICE_INVALID}
