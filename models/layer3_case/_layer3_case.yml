version: 2

models:
  - name: case_dim_customer
    description: >
      Controlled customer dimension view. It preserves pseudonymous lineage keys and resolves only
      approved customer ID, name, email, and address fields for case users and privacy administrators.
    config:
      contract:
        enforced: true
      tags: [case_views]
      databricks_tags:
        contains_personal_data: "true"
        personal_data_state: "CONTROLLED_READABLE"
    columns:
      - name: customer_key
        data_type: string
        description: Pseudonymous customer key.
        databricks_tags: &national_identifier_tag
          personal_data_category: "NATIONAL_IDENTIFIER"
          personal_data_state: "PSEUDONYMIZED"
      - name: customer_id_key
        data_type: string
        description: Pseudonymous customer business identifier.
        databricks_tags: &customer_identifier_tag
          personal_data_category: "CUSTOMER_IDENTIFIER"
          personal_data_state: "PSEUDONYMIZED"
      - name: full_name_key
        data_type: string
        description: Pseudonymous full name.
        databricks_tags: &name_key_tag
          personal_data_category: "NAME"
          personal_data_state: "PSEUDONYMIZED"
      - name: email_key
        data_type: string
        description: Pseudonymous email.
        databricks_tags: &email_key_tag
          personal_data_category: "EMAIL"
          personal_data_state: "PSEUDONYMIZED"
      - name: address_key
        data_type: string
        description: Pseudonymous customer address.
        databricks_tags: &address_key_tag
          personal_data_category: "ADDRESS"
          personal_data_state: "PSEUDONYMIZED"
      - name: customer_segment
        data_type: string
        description: Non-identifying commercial segment.
      - name: is_active
        data_type: boolean
        description: Current customer lifecycle flag.
      - name: customer_id
        data_type: string
        description: Readable customer identifier for an authorized case.
        databricks_tags:
          personal_data_category: "CUSTOMER_IDENTIFIER"
          personal_data_state: "RAW"
      - name: full_name
        data_type: string
        description: Readable full name for an authorized case.
        databricks_tags: &raw_name_tag
          personal_data_category: "NAME"
          personal_data_state: "RAW"
      - name: email
        data_type: string
        description: Readable email for an authorized case.
        databricks_tags: &raw_email_tag
          personal_data_category: "EMAIL"
          personal_data_state: "RAW"
      - name: customer_address
        data_type: string
        description: Readable customer address for an authorized case.
        databricks_tags: &raw_address_tag
          personal_data_category: "ADDRESS"
          personal_data_state: "RAW"

  - name: case_dim_service
    description: >
      Controlled service dimension view. It preserves the complete pseudonymous service tuple and
      resolves only service ID and installation address for authorized case workflows.
    config:
      contract:
        enforced: true
      tags: [case_views]
      databricks_tags:
        contains_personal_data: "true"
        personal_data_state: "CONTROLLED_READABLE"
    columns:
      - name: customer_key
        data_type: string
        description: Pseudonymous owning customer key.
        databricks_tags: *national_identifier_tag
      - name: service_key
        data_type: string
        description: Pseudonymous service identifier.
        databricks_tags: &service_key_tag
          personal_data_category: "SERVICE_IDENTIFIER"
          personal_data_state: "PSEUDONYMIZED"
      - name: service_version_key
        data_type: string
        description: Pseudonymous service-period key.
        databricks_tags: *service_key_tag
      - name: installation_address_key
        data_type: string
        description: Pseudonymous installation address.
        databricks_tags: *address_key_tag
      - name: service_type
        data_type: string
        description: Normalized service category.
      - name: is_valid
        data_type: boolean
        description: Accepted service validity flag.
      - name: valid_from
        data_type: date
        description: First date in the service period.
      - name: valid_to
        data_type: date
        description: Last date in the service period.
      - name: service_id
        data_type: string
        description: Readable service identifier for an authorized case.
        databricks_tags:
          personal_data_category: "SERVICE_IDENTIFIER"
          personal_data_state: "RAW"
      - name: installation_address
        data_type: string
        description: Readable installation address for an authorized case.
        databricks_tags: *raw_address_tag

  - name: case_fct_customer_event
    description: >
      Controlled event fact view with pseudonymous lineage plus approved readable customer name
      and email for authorized case workflows.
    config:
      contract:
        enforced: true
      tags: [case_views]
      databricks_tags:
        contains_personal_data: "true"
        personal_data_state: "CONTROLLED_READABLE"
    columns:
      - name: event_key
        data_type: string
        description: Event fact key.
      - name: customer_key
        data_type: string
        description: Pseudonymous customer key.
        databricks_tags: *national_identifier_tag
      - name: full_name_key
        data_type: string
        description: Pseudonymous full name.
        databricks_tags: *name_key_tag
      - name: email_key
        data_type: string
        description: Pseudonymous email.
        databricks_tags: *email_key_tag
      - name: event_date_key
        data_type: int
        description: Event calendar key.
      - name: occurred_at
        data_type: timestamp
        description: Event occurrence timestamp.
      - name: event_type
        data_type: string
        description: Normalized event category.
      - name: measure_value
        data_type: decimal(18,2)
        description: Numeric event measure.
      - name: measure_unit
        data_type: string
        description: Unit for measure_value.
      - name: full_name
        data_type: string
        description: Readable full name for an authorized case.
        databricks_tags: *raw_name_tag
      - name: email
        data_type: string
        description: Readable email for an authorized case.
        databricks_tags: *raw_email_tag

  - name: case_fct_invoice
    description: >
      Controlled invoice fact view with protected lineage plus approved readable customer name,
      email, service ID, and installation address for authorized case workflows.
    config:
      contract:
        enforced: true
      tags: [case_views]
      databricks_tags:
        contains_personal_data: "true"
        personal_data_state: "CONTROLLED_READABLE"
    columns:
      - name: invoice_key
        data_type: string
        description: Invoice fact key.
      - name: customer_key
        data_type: string
        description: Pseudonymous customer key.
        databricks_tags: *national_identifier_tag
      - name: service_key
        data_type: string
        description: Pseudonymous service identifier.
        databricks_tags: *service_key_tag
      - name: service_version_key
        data_type: string
        description: Pseudonymous service-period key.
        databricks_tags: *service_key_tag
      - name: full_name_key
        data_type: string
        description: Pseudonymous full name.
        databricks_tags: *name_key_tag
      - name: email_key
        data_type: string
        description: Pseudonymous email.
        databricks_tags: *email_key_tag
      - name: installation_address_key
        data_type: string
        description: Pseudonymous installation address.
        databricks_tags: *address_key_tag
      - name: issue_date_key
        data_type: int
        description: Invoice issue calendar key.
      - name: due_date_key
        data_type: int
        description: Invoice due calendar key.
      - name: paid_date_key
        data_type: int
        description: Payment calendar key, null for unpaid invoices.
      - name: amount
        data_type: decimal(18,2)
        description: Gross invoice amount.
      - name: currency_code
        data_type: string
        description: Billing currency code.
      - name: is_paid
        data_type: boolean
        description: Validated payment state.
      - name: is_due
        data_type: boolean
        description: dbt-calculated due state.
      - name: full_name
        data_type: string
        description: Readable full name for an authorized case.
        databricks_tags: *raw_name_tag
      - name: email
        data_type: string
        description: Readable email for an authorized case.
        databricks_tags: *raw_email_tag
      - name: service_id
        data_type: string
        description: Readable service identifier for an authorized case.
        databricks_tags:
          personal_data_category: "SERVICE_IDENTIFIER"
          personal_data_state: "RAW"
      - name: installation_address
        data_type: string
        description: Readable installation address for an authorized case.
        databricks_tags: *raw_address_tag
