version: 2

models:
  - name: fa_pd_customer
    description: >
      Full-access Personal Data map at one row per current active customer. Raw values are stored
      beside stable, versioned, domain-separated pseudonymous keys. Unity Catalog masks return
      raw values only to authorized groups and the matching stored key to other readers.
    config:
      contract:
        enforced: true
      tags: [customer]
      databricks_tags:
        contains_personal_data: "true"
        personal_data_area: "priva_map"
    columns:
      - name: customer_key
        data_type: string
        description: Stable v1 customer key derived from the canonical SSN in customer.ssn.
        databricks_tags:
          personal_data_category: "NATIONAL_IDENTIFIER"
          personal_data_state: "PSEUDONYMIZED"
        data_tests: [not_null, unique]
      - name: customer_pk_key
        data_type: string
        description: Versioned pseudonymous source-row identifier.
        databricks_tags:
          personal_data_category: "SOURCE_RECORD_IDENTIFIER"
          personal_data_state: "PSEUDONYMIZED"
        data_tests: [not_null, unique]
      - name: customer_id_key
        data_type: string
        description: Versioned pseudonymous customer business identifier.
        databricks_tags:
          personal_data_category: "CUSTOMER_IDENTIFIER"
          personal_data_state: "PSEUDONYMIZED"
        data_tests: [not_null, unique]
      - name: first_name_key
        data_type: string
        description: Domain-separated pseudonymous first name.
        databricks_tags:
          personal_data_category: "NAME"
          personal_data_state: "PSEUDONYMIZED"
        data_tests: [not_null]
      - name: last_name_key
        data_type: string
        description: Domain-separated pseudonymous last name.
        databricks_tags:
          personal_data_category: "NAME"
          personal_data_state: "PSEUDONYMIZED"
        data_tests: [not_null]
      - name: full_name_key
        data_type: string
        description: Domain-separated pseudonymous full name.
        databricks_tags:
          personal_data_category: "NAME"
          personal_data_state: "PSEUDONYMIZED"
        data_tests: [not_null]
      - name: email_key
        data_type: string
        description: Domain-separated pseudonymous lowercase email.
        databricks_tags:
          personal_data_category: "EMAIL"
          personal_data_state: "PSEUDONYMIZED"
        data_tests: [not_null]
      - name: phone_key
        data_type: string
        description: Domain-separated pseudonymous digits-only telephone number.
        databricks_tags:
          personal_data_category: "PHONE"
          personal_data_state: "PSEUDONYMIZED"
        data_tests: [not_null]
      - name: birth_date_key
        data_type: string
        description: Domain-separated pseudonymous ISO birth date.
        databricks_tags:
          personal_data_category: "BIRTH_DATE"
          personal_data_state: "PSEUDONYMIZED"
        data_tests: [not_null]
      - name: address_key
        data_type: string
        description: Domain-separated pseudonymous normalized customer address.
        databricks_tags:
          personal_data_category: "ADDRESS"
          personal_data_state: "PSEUDONYMIZED"
        data_tests: [not_null]
      - name: customer_pk_value
        data_type: string
        description: Raw source numeric row identifier represented as a string for masking.
        databricks_tags:
          personal_data_category: "SOURCE_RECORD_IDENTIFIER"
          personal_data_state: "RAW"
        column_mask:
          function: "{{ env_var('DBT_PROJECT_CATALOG', 'bricksgdpr') }}.priva_internal.mask_priva_map_value"
          using_columns: "customer_pk_key"
      - name: customer_id_value
        data_type: string
        description: Raw customer business identifier available only through authorized access.
        databricks_tags:
          personal_data_category: "CUSTOMER_IDENTIFIER"
          personal_data_state: "RAW"
        column_mask:
          function: "{{ env_var('DBT_PROJECT_CATALOG', 'bricksgdpr') }}.priva_internal.mask_priva_map_value"
          using_columns: "customer_id_key"
      - name: customer_ssn_value
        data_type: string
        description: Raw synthetic SSN available only through authorized access.
        databricks_tags:
          personal_data_category: "NATIONAL_IDENTIFIER"
          personal_data_state: "RAW"
        column_mask:
          function: "{{ env_var('DBT_PROJECT_CATALOG', 'bricksgdpr') }}.priva_internal.mask_priva_map_value"
          using_columns: "customer_key"
      - name: first_name_value
        data_type: string
        description: Raw first name available only through authorized access.
        databricks_tags:
          personal_data_category: "NAME"
          personal_data_state: "RAW"
        column_mask:
          function: "{{ env_var('DBT_PROJECT_CATALOG', 'bricksgdpr') }}.priva_internal.mask_priva_map_value"
          using_columns: "first_name_key"
      - name: last_name_value
        data_type: string
        description: Raw last name available only through authorized access.
        databricks_tags:
          personal_data_category: "NAME"
          personal_data_state: "RAW"
        column_mask:
          function: "{{ env_var('DBT_PROJECT_CATALOG', 'bricksgdpr') }}.priva_internal.mask_priva_map_value"
          using_columns: "last_name_key"
      - name: full_name_value
        data_type: string
        description: Raw composed full name available only through authorized access.
        databricks_tags:
          personal_data_category: "NAME"
          personal_data_state: "RAW"
        column_mask:
          function: "{{ env_var('DBT_PROJECT_CATALOG', 'bricksgdpr') }}.priva_internal.mask_priva_map_value"
          using_columns: "full_name_key"
      - name: email_value
        data_type: string
        description: Raw email available only through authorized access.
        databricks_tags:
          personal_data_category: "EMAIL"
          personal_data_state: "RAW"
        column_mask:
          function: "{{ env_var('DBT_PROJECT_CATALOG', 'bricksgdpr') }}.priva_internal.mask_priva_map_value"
          using_columns: "email_key"
      - name: phone_value
        data_type: string
        description: Raw telephone number available only through authorized access.
        databricks_tags:
          personal_data_category: "PHONE"
          personal_data_state: "RAW"
        column_mask:
          function: "{{ env_var('DBT_PROJECT_CATALOG', 'bricksgdpr') }}.priva_internal.mask_priva_map_value"
          using_columns: "phone_key"
      - name: birth_date_value
        data_type: string
        description: Raw birth date in ISO string form so its mask can return a hash.
        databricks_tags:
          personal_data_category: "BIRTH_DATE"
          personal_data_state: "RAW"
        column_mask:
          function: "{{ env_var('DBT_PROJECT_CATALOG', 'bricksgdpr') }}.priva_internal.mask_priva_map_value"
          using_columns: "birth_date_key"
      - name: address_value
        data_type: string
        description: Raw composed customer address available only through authorized access.
        databricks_tags:
          personal_data_category: "ADDRESS"
          personal_data_state: "RAW"
        column_mask:
          function: "{{ env_var('DBT_PROJECT_CATALOG', 'bricksgdpr') }}.priva_internal.mask_priva_map_value"
          using_columns: "address_key"
      - name: customer_segment
        data_type: string
        description: Commercial segment copied for controlled operational use.
      - name: is_active
        data_type: boolean
        description: Current source lifecycle state; only active rows are mapped.
      - name: source_updated_at
        data_type: timestamp
        description: Timestamp of the source change that established the current map row.

  - name: fa_pd_service_address
    description: >
      Full-access service-address map at one row per accepted service validity period. It excludes
      deleted, late, and invalid services and stores raw service/address values beside their
      versioned pseudonymous keys.
    config:
      contract:
        enforced: true
      tags: [customer_service]
      databricks_tags:
        contains_personal_data: "true"
        personal_data_area: "priva_map"
    columns:
      - name: customer_key
        data_type: string
        description: Stable v1 key that resolves the service to an active customer.
        databricks_tags:
          personal_data_category: "NATIONAL_IDENTIFIER"
          personal_data_state: "PSEUDONYMIZED"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fa_pd_customer')
                field: customer_key
      - name: service_key
        data_type: string
        description: Domain-separated pseudonymous service identifier.
        databricks_tags:
          personal_data_category: "SERVICE_IDENTIFIER"
          personal_data_state: "PSEUDONYMIZED"
        data_tests: [not_null]
      - name: service_version_key
        data_type: string
        description: Pseudonymous key for one service identifier and valid-from pair.
        databricks_tags:
          personal_data_category: "SERVICE_IDENTIFIER"
          personal_data_state: "PSEUDONYMIZED"
        data_tests: [not_null, unique]
      - name: installation_address_key
        data_type: string
        description: Domain-separated pseudonymous installation address.
        databricks_tags:
          personal_data_category: "ADDRESS"
          personal_data_state: "PSEUDONYMIZED"
        data_tests: [not_null]
      - name: service_id_value
        data_type: string
        description: Raw source service identifier available only through authorized access.
        databricks_tags:
          personal_data_category: "SERVICE_IDENTIFIER"
          personal_data_state: "RAW"
        column_mask:
          function: "{{ env_var('DBT_PROJECT_CATALOG', 'bricksgdpr') }}.priva_internal.mask_priva_map_value"
          using_columns: "service_key"
      - name: customer_ssn_value
        data_type: string
        description: Raw synthetic SSN available only through authorized access.
        databricks_tags:
          personal_data_category: "NATIONAL_IDENTIFIER"
          personal_data_state: "RAW"
        column_mask:
          function: "{{ env_var('DBT_PROJECT_CATALOG', 'bricksgdpr') }}.priva_internal.mask_priva_map_value"
          using_columns: "customer_key"
      - name: installation_address_value
        data_type: string
        description: Raw composed installation address available only through authorized access.
        databricks_tags:
          personal_data_category: "ADDRESS"
          personal_data_state: "RAW"
        column_mask:
          function: "{{ env_var('DBT_PROJECT_CATALOG', 'bricksgdpr') }}.priva_internal.mask_priva_map_value"
          using_columns: "installation_address_key"
      - name: service_type
        data_type: string
        description: Non-identifying normalized service category.
      - name: is_valid
        data_type: boolean
        description: Source validity flag; this map contains only true values.
      - name: valid_from
        data_type: date
        description: First date of the mapped service period.
      - name: valid_to
        data_type: date
        description: Last date of the mapped service period.
      - name: source_updated_at
        data_type: timestamp
        description: Last source update for the mapped service period.
