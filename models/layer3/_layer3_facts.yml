version: 2

models:
  - name: fct_customer_event
    description: >
      Customer-event fact at one row per accepted event. It links to customer and date dimensions
      using a pseudonymous or erased-member customer key and an integer calendar key.
    config:
      contract:
        enforced: true
      tags: [layer3_facts, personal_data]
      databricks_tags:
        contains_personal_data: "true"
        personal_data_state: "PSEUDONYMIZED"
    columns:
      - name: event_key
        data_type: string
        description: Degenerate event fact key copied from the source event identifier.
        data_tests: [not_null, unique]
      - name: customer_key
        data_type: string
        description: Pseudonymous customer dimension key.
        databricks_tags:
          personal_data_category: "NATIONAL_IDENTIFIER"
          personal_data_state: "PSEUDONYMIZED"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: event_date_key
        data_type: int
        description: Calendar key for the event occurrence date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: occurred_at
        data_type: timestamp
        description: Event occurrence timestamp.
        data_tests: [not_null]
      - name: event_type
        data_type: string
        description: Normalized event category.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["USAGE", "SUPPORT"]
      - name: measure_value
        data_type: decimal(18,2)
        description: Numeric event measure.
        data_tests: [not_null]
      - name: measure_unit
        data_type: string
        description: Unit for measure_value.
        data_tests: [not_null]
      - name: source_updated_at
        data_type: timestamp
        description: Last source update timestamp.
        data_tests: [not_null]
      - name: is_erased_customer
        data_type: boolean
        description: True when the original customer relationship was replaced by the erased member.
        data_tests: [not_null]

  - name: fct_invoice
    description: >
      Invoice fact at one row per accepted invoice. It links to customer, service-period, and
      conformed date dimensions while retaining monetary and validated payment measures. Erased
      subjects use special customer and service members instead of their original relationships.
    config:
      contract:
        enforced: true
      tags: [layer3_facts, personal_data]
      databricks_tags:
        contains_personal_data: "true"
        personal_data_state: "PSEUDONYMIZED"
    columns:
      - name: invoice_key
        data_type: string
        description: Degenerate invoice fact key copied from the source invoice identifier.
        data_tests: [not_null, unique]
      - name: customer_key
        data_type: string
        description: Pseudonymous customer dimension key.
        databricks_tags:
          personal_data_category: "NATIONAL_IDENTIFIER"
          personal_data_state: "PSEUDONYMIZED"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: service_key
        data_type: string
        description: Pseudonymous service identifier.
        databricks_tags: &service_identifier_tag
          personal_data_category: "SERVICE_IDENTIFIER"
          personal_data_state: "PSEUDONYMIZED"
        data_tests: [not_null]
      - name: service_version_key
        data_type: string
        description: Service-dimension key effective on the invoice issue date.
        databricks_tags: *service_identifier_tag
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_service')
                field: service_version_key
      - name: issue_date_key
        data_type: int
        description: Calendar key for the issue date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: due_date_key
        data_type: int
        description: Calendar key for the contractual due date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: paid_date_key
        data_type: int
        description: Calendar key for the payment date, null for unpaid invoices.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: amount
        data_type: decimal(18,2)
        description: Gross invoice amount.
        data_tests: [not_null]
      - name: currency_code
        data_type: string
        description: Billing currency code.
        data_tests: [not_null]
      - name: is_paid
        data_type: boolean
        description: Validated payment-state flag.
        data_tests: [not_null]
      - name: source_is_due
        data_type: boolean
        description: Source due-state flag retained for audit comparison.
        data_tests: [not_null]
      - name: is_due
        data_type: boolean
        description: Due state calculated by dbt for the configured as-of date.
        data_tests: [not_null]
      - name: source_updated_at
        data_type: timestamp
        description: Last source update timestamp.
        data_tests: [not_null]
      - name: is_erased_customer
        data_type: boolean
        description: True when original customer and service relationships were replaced.
        data_tests: [not_null]
