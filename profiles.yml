bricksgdpr:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      catalog: "{{ env_var('DBT_CONTROL_CATALOG', 'workspace') }}"
      schema: "{{ env_var('DBT_CONTROL_SCHEMA', 'default') }}"
      auth_type: oauth
      threads: 4
